<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Form</title>
  <!-- MDBootstrap / Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  
  
</head>

<body>
  <script>
    // Check if an alert message is passed from the backend
    {% if alert_message %}
    alert("{{ alert_message }}");
    {% endif %}
</script>
<nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
  <div class="container-fluid px-4">
      <!-- Title with larger font size -->
      <a class="navbar-brand fw-bold" href="#page-top" style="font-size: 1.8rem;">
        <i class='fas fa-clone mx-2' style='font-size:30px;color:blue' ></i>Bill Up</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
          Menu
          <i class="bi-list"></i>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
          <ul class="navbar-nav me-4 my-3 my-lg-0">
              <li class="nav-item"><a class="nav-link me-lg-3" href="#features">About Us</a></li>
              <li class="nav-item"><a class="nav-link me-lg-3" href="#features">Features</a></li>
              <li class="nav-item"><a class="nav-link me-lg-3" href="#download">Team</a></li>
          </ul>
          <!-- Profile Icon -->
          <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-3 mb-2 mb-lg-0">
              <span class="d-flex align-items-center">
                  
                  <span class="small">Home</span>
              </span>
          </a>
      </div>
  </div>
</nav>
    
  
  <section class="container-fluid h-custom">
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp" class="img-fluid"
            alt="Sample image">
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
          <form action="/register" method="POST"  onsubmit="return validateForm()">
            <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start mb-4">
              <p class="lead fw-normal mb-0 me-3" style="margin-top: 120px;">Register with </p>
              <button type="button"  style="margin-top: 120px;" class="btn btn-primary btn-floating mx-1 d-flex align-items-center justify-content-center">
                <i class="fab fa-google"></i>
              </button>              
            </div>

            <div class="divider d-flex align-items-center my-4">
              <p class="text-center fw-bold mx-3 mb-0">Or</p>
            </div>

            <!-- Bussiness Name input -->
            <div class="form-outline mb-4">
              <input type="text" name="bName" id="form3Example1" class="form-control form-control-lg"
              value="{{ form_data.get('bName', '') if form_data else '' }}"  placeholder="Enter your Bussiness Name" />
              <label class="form-label" for="form3Example1">Bussiness Name</label>
              
            </div>
            <!-- Bussiness Address input -->
            <div class="form-outline mb-4">
              <input type="text"  name="bAddress" id="form3Example2" class="form-control form-control-lg"
              value="{{ form_data.get('bAddress', '') if form_data else '' }}"  placeholder="Enter your Bussiness Address" />
              <label class="form-label" for="form3Example2">Bussiness Address</label>
            </div>

            <!-- Business Type input -->
<!-- <div class="form-outline mb-4">
  <label class="form-label" for="businessTypeSelect">Business Type</label>
  <select id="businessTypeSelect" class="form-control form-control-lg">
    <option value="" disabled selected>Select your business type</option>
    <option value="retail">Retail</option>
    <option value="wholesale">Wholesale</option>
    <option value="service">Service</option>
    <option value="manufacturing">Manufacturing</option>
    <option value="technology">Technology</option>
    <option value="other">Other</option>
  </select>
</div> -->
<!-- Bussiness Type input -->
<div class="form-outline mb-4">
  <input type="text" name="bType" id="form3Example9" class="form-control form-control-lg"
  value="{{ form_data.get('bType', '') if form_data else '' }}"  placeholder="Enter Bussiness Type" />
  <label class="form-label" for="form3Example9">Bussiness Type</label>
</div>


            <!-- User Id input -->
            <div class="form-outline mb-4">
              <input type="text" name="UserID" id="form3Example4" class="form-control form-control-lg"
              value="{{ form_data.get('UserID', '') if form_data else '' }}"  placeholder="Enter a valid User Id" />
              <label class="form-label" for="form3Example4">User Id</label>
            </div>

            <!-- User Email input -->
            <div class="form-outline mb-4">
              <input type="email" name="Email" id="form3Example5" class="form-control form-control-lg"
              value="{{ form_data.get('Email', '') if form_data else '' }}"  placeholder="Enter a valid email" />
              <label class="form-label" for="form3Example5">Email</label>
            </div>

            <!-- User Contact input -->
            <div class="form-outline mb-4">
              <input type="tel" minlength="10" maxlength="10"   pattern="^\d{10}$" name="Contact" id="form3Example6" class="form-control form-control-lg"
              value="{{ form_data.get('Contact', '') if form_data else '' }}"  placeholder="Enter a valid phone number"  required/>
              <label class="form-label" for="form3Example6">Contact No.</label>
            </div>

            <!-- Password input -->
            <div class="form-outline mb-3">
              <input type="password"  name="Password" maxlength="8" id="form3Example7" class="form-control form-control-lg" placeholder="Enter password (max limit 8 characters)" />
              <label class="form-label" for="form3Example7">Password</label>
            </div>

            <!--Conmfirm Password input -->
            <div class="form-outline mb-3">
              <input type="ConfirmPassword" maxlength="8" name="ConfirmPassword" id="form3Example8" class="form-control form-control-lg" placeholder="Confirm password" />
              <label class="form-label" for="form3Example8">Confirm Password</label>
            </div>

            <div class="d-flex justify-content-between align-items-center">
             

            <div class="text-center text-lg-start mt-4 pt-2">
              <button type="submit" class="btn btn-primary btn-lg" style="padding-left: 2.5rem; padding-right: 2.5rem;">
                Create Account
              </button>
              <p class="small fw-bold mt-2 pt-1 mb-0">Made the account? <a href="{{ url_for('login') }}" class="link-danger">Login</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div
      class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary">
      <!-- Copyright -->
      <div class="text-white mb-3 mb-md-0 ">
        Copyright © 2025. All rights reserved.
      </div>
      <!-- Right -->
      <div>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-google"></i>
        </a>
        <a href="#!" class="text-white">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </div>
  </section>

  <!-- MDBootstrap / Bootstrap JS -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.js"></script>
</body>

</html>
