<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Form</title>
  <!-- MDBootstrap / Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
  
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light fixed-top shadow-sm" id="mainNav">
  <div class="container-fluid px-4">
      <!-- Title with larger font size -->
      <a class="navbar-brand fw-bold" href="#page-top" style="font-size: 1.8rem;">
        <i class='fas fa-clone mx-2' style='font-size:30px;color:blue' ></i>
        Bill Up</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
          Menu
          <i class="bi-list"></i>
      </button>
      <div class="collapse navbar-collapse justify-content-end" id="navbarResponsive">
          <ul class="navbar-nav me-4 my-3 my-lg-0">
              <li class="nav-item"><a class="nav-link me-lg-3" href="#features">About Us</a></li>
              <li class="nav-item"><a class="nav-link me-lg-3" href="#features">Features</a></li>
              <li class="nav-item"><a class="nav-link me-lg-3" href="#download">Team</a></li>
          </ul>
          <!-- Profile Icon -->
          <a href="{{ url_for('index') }}" class="btn btn-primary rounded-pill px-3 mb-2 mb-lg-0">
              <span class="d-flex align-items-center">
                  
                  <span class="small">Home</span>
              </span>
          </a>
      </div>
  </div>
</nav>
    
  
  <section class="vh-100">
    <div class="container-fluid h-custom">
      <div class="row d-flex justify-content-center align-items-center h-100">
        <div class="col-md-9 col-lg-6 col-xl-5">
          <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.webp" class="img-fluid"
            alt="Sample image">
        </div>
        <div class="col-md-8 col-lg-6 col-xl-4 offset-xl-1">
          <form action="/login" method="POST">
            <div class="d-flex flex-row align-items-center justify-content-center justify-content-lg-start mb-4">
              <p class="lead fw-normal mb-0 me-3">Sign in with</p>
            </div>

            <div class="divider d-flex align-items-center my-4">
            </div>

            <!-- UserID input -->
            <div class="form-outline mb-4">
              <input type="text" id="form3Example3" name="UserID" class="form-control form-control-lg"
                placeholder="Enter a valid User Id" value="{{ user_id if user_id else '' }}" required />
              <label class="form-label" for="form3Example3">User Id</label>
            </div>

            <!-- Password input with eye icon -->
            <div class="form-outline mb-3 position-relative">
              <input type="password" id="form3Example4" minlength="8" maxlength="8" name="Password" class="form-control form-control-lg" placeholder="Enter password" required />
              <label class="form-label" for="form3Example4">Password</label>
              <i class="fas fa-eye position-absolute" id="togglePassword" style="right: 15px; top: 18px; cursor: pointer; color: #666;"></i>
            </div>

            <!-- Error message display -->
            {% if error_message %}
            <div class="alert alert-danger py-2 mb-3 d-flex align-items-center justify-content-between" role="alert" style="font-size: 0.9rem;" id="errorAlert">
              <div>
                <i class="fas fa-exclamation-circle me-2"></i>{{ error_message }}
              </div>
              <button type="button" class="btn-close" onclick="closeAlert()" aria-label="Close" style="font-size: 0.7rem; padding: 0; margin: 0; outline: none; box-shadow: none !important; opacity: 0.8; cursor: pointer;"></button>
            </div>
            {% endif %}

            <div class="d-flex justify-content-between align-items-center">
              <!-- Checkbox -->
              <div class="form-check mb-0">
                <input class="form-check-input me-2" name="form3Example3" type="checkbox" value="" id="form2Example3" />
                <label class="form-check-label" for="form2Example3">
                  Remember me
                </label>
              </div>
              <a href="#!" class="text-body">Forgot password?</a>
            </div>

            <div class="text-center text-lg-start mt-4 pt-2">
              <button type="submit" class="btn btn-primary btn-lg w-100" style="border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 500;">
                Login
              </button>
              <p class="small fw-bold mt-2 pt-1 mb-0">Don't have an account? <a href="{{ url_for('register') }}" class="link-danger">Register</a></p>
            </div>
          </form>
        </div>
      </div>
    </div>
    <div
      class="d-flex flex-column flex-md-row text-center text-md-start justify-content-between py-4 px-4 px-xl-5 bg-primary">
      <!-- Copyright -->
      <div class="text-white mb-3 mb-md-0">
        Copyright © 2025. All rights reserved.
      </div>
      <!-- Right -->
      <div>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-facebook-f"></i>
        </a>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-twitter"></i>
        </a>
        <a href="#!" class="text-white me-4">
          <i class="fab fa-google"></i>
        </a>
        <a href="#!" class="text-white">
          <i class="fab fa-linkedin-in"></i>
        </a>
      </div>
    </div>
  </section>

  <!-- MDBootstrap / Bootstrap JS -->
  <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.2.0/mdb.min.js"></script>
  
  <!-- Password visibility toggle script -->
  <script>
    // Close alert function
    function closeAlert() {
      const alert = document.getElementById('errorAlert');
      if (alert) {
        alert.style.display = 'none';
      }
    }

    const togglePassword = document.getElementById('togglePassword');
    const passwordField = document.getElementById('form3Example4');
    
    if (togglePassword) {
      togglePassword.addEventListener('click', function() {
        // Toggle the password field type
        const type = passwordField.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordField.setAttribute('type', type);
        
        // Toggle the eye icon
        this.classList.toggle('fa-eye');
        this.classList.toggle('fa-eye-slash');
      });
    }

    // Form validation
    document.querySelector('form').addEventListener('submit', function(e) {
      const userId = document.getElementById('form3Example3').value.trim();
      const password = document.getElementById('form3Example4').value.trim();
      
      if (!userId || !password) {
        e.preventDefault();
        alert('Please fill in all fields');
        return false;
      }
    });
  </script>
</body>

</html>
